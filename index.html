<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Statistiken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deepslate: #1d2125;
    --stone: #2e343a;
    --cobble: #4a525a;
    --chalk: #ebe6d6;
    --chalk-dim: #a9a79c;
    --redstone: #d9402f;
    --emerald: #3fbf74;
    --gold: #e8b63a;
    --lapis: #5b86ea;
    --font-display: "Silkscreen", ui-monospace, monospace;
    --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--deepslate); }
  body { margin: 0; color: var(--chalk); font: 16px/1.5 var(--font-body); min-height: 100vh; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  [hidden] { display: none !important; }

  /* Kopfbereich */
  .top {
    display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between;
    padding-bottom: 20px; margin-bottom: 20px; border-bottom: 6px solid var(--emerald);
  }
  h1 { color: var(--gold); text-shadow: 3px 3px 0 #0f1114; }
  h1 { margin: 0; font: 700 clamp(22px, 4vw, 34px)/1.15 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
  .sub { margin: 6px 0 0; color: var(--chalk-dim); }
  .live { display: flex; align-items: center; gap: 14px; }
  .count { font: 700 clamp(30px, 6vw, 48px)/1 var(--font-display); white-space: nowrap; }
  .count small { font-size: .45em; color: var(--chalk-dim); font-weight: 400; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--stone); font-size: 14px;
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b;
  }
  .dot { width: 10px; height: 10px; background: var(--cobble); }
  .pill[data-state="live"] .dot { background: var(--emerald); animation: pulse 1s steps(2, end) infinite; }
  .pill[data-state="demo"] .dot { background: var(--gold); }
  .pill[data-state="off"] .dot { background: var(--redstone); }
  .pill[data-state="cache"] .dot { background: var(--gold); }
  @keyframes pulse { 50% { opacity: .25; } }

  /* Knoepfe (Ansichten, Statistiken, Werkzeuge) */
  .views { display: flex; gap: 10px; margin-bottom: 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab {
    font: 700 13px/1 var(--font-display); letter-spacing: .02em; color: var(--chalk); background: var(--stone);
    border: 0; padding: 11px 12px; cursor: pointer;
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b, 0 0 0 2px #0f1114;
  }
  .tab:hover { background: #373e45; }
  .tab[aria-pressed="true"] {
    color: #0e2a19; background: var(--emerald);
    box-shadow: inset 2px 2px 0 #7fe0a6, inset -2px -2px 0 #1f7a47, 0 0 0 2px #0f1114;
  }
  .views .tab { font-size: 15px; padding: 13px 18px; }
  .tab:focus-visible, .field input:focus-visible, .swatch input:focus-visible + span,
  .btn:focus-visible, .plist button:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }

  /* Farben je Statistik */
  #view-stats { --accent: var(--emerald); }
  #tabs .tab { --c: var(--emerald); border-bottom: 4px solid color-mix(in srgb, var(--c) 55%, var(--stone)); }
  #tabs .tab[aria-pressed="true"] {
    color: #111; background: var(--c); border-bottom-color: color-mix(in srgb, var(--c) 55%, black);
    box-shadow: inset 2px 2px 0 color-mix(in srgb, var(--c) 55%, white), inset -2px -2px 0 color-mix(in srgb, var(--c) 60%, black), 0 0 0 2px #0f1114;
  }
  .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
  @media (max-width: 700px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .chip {
    padding: 10px 10px 10px 12px; min-width: 0; background: color-mix(in srgb, var(--c) 22%, var(--stone)); border-left: 5px solid var(--c);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.12), inset -2px -2px 0 rgba(0,0,0,.35), 0 0 0 2px #0f1114;
  }
  .chip span { display: block; font-size: 13px; line-height: 1.3; color: var(--chalk); opacity: .85; }
  .chip strong { display: block; margin-top: 4px; font: 700 16px/1.2 var(--font-display); color: var(--c); overflow-wrap: anywhere; }
  .row.offline { opacity: .62; }
  .row.offline .head { filter: grayscale(.6); }
  .on { display: inline-block; width: 9px; height: 9px; margin-right: 6px; background: var(--emerald); }
  .row.offline .on { background: var(--cobble); }

  .field input {
    font: inherit; color: var(--chalk); background: var(--deepslate); border: 0; padding: 9px 12px; width: 100%;
    box-shadow: inset 2px 2px 0 #0f1114, inset -2px -2px 0 #4a525a;
  }

  /* Liste (Statistiken) */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 28px 56px minmax(0, 1fr) auto; gap: 0 14px; align-items: center;
    background: color-mix(in srgb, var(--accent) 7%, var(--stone)); padding: 12px 16px 12px 12px; border-left: 6px solid var(--accent);
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b, 0 0 0 2px #0f1114;
  }
  .rank { font: 700 14px var(--font-display); color: var(--chalk-dim); text-align: center; }
  .head { width: 56px; height: 56px; background: var(--cobble); display: block; box-shadow: 0 0 0 2px #0f1114; }
  .head > * { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .name { min-width: 0; }
  .name h3 { margin: 0; font: 700 17px/1.25 var(--font-display); overflow-wrap: anywhere; }
  .name p { margin: 2px 0 0; font-size: 14px; color: var(--chalk-dim); }
  .val { text-align: right; min-width: 0; }
  .val strong { display: block; font: 700 clamp(18px, 3.4vw, 26px)/1.1 var(--font-display); letter-spacing: .02em; white-space: nowrap; }
  .val strong { color: var(--accent); }
  .val span { font-size: 13px; color: var(--chalk-dim); }
  .row[data-rank="1"] .rank { color: var(--gold); font-size: 20px; }
  .row[data-rank="2"] .rank { color: #cfd6dc; font-size: 17px; }
  .row[data-rank="3"] .rank { color: #d08a4e; font-size: 17px; }
  .bar { grid-column: 3 / -1; height: 6px; background: #1a1d21; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s steps(12, end); }
  .flash { animation: flash .6s ease-out; }
  @keyframes flash { from { color: #fff; } }

  .empty { padding: 40px 16px; background: var(--stone); text-align: center;
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b; }
  .empty p { margin: 4px 0; color: var(--chalk-dim); }
  .empty strong { font: 700 18px var(--font-display); }

  /* Karte */
  .maptools { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 12px; }
  .maptools .group { display: flex; gap: 8px; }
  .mapframe {
    background: #15181b; padding: 8px;
    box-shadow: inset 2px 2px 0 #0f1114, inset -2px -2px 0 #4a525a, 0 0 0 2px #0f1114;
  }
  #map { display: block; width: min(100%, 78vh); aspect-ratio: 1; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #map { cursor: crosshair; }
  #map .land { fill: #26302a; stroke: #5a636b; stroke-width: 2; vector-effect: non-scaling-stroke; }
  #map .gl { fill: none; stroke: rgba(235, 230, 214, .11); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #map .ga { fill: none; stroke: rgba(235, 230, 214, .35); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  #map .glabel { fill: rgba(235, 230, 214, .6); font-family: var(--font-body); pointer-events: none; }
  #map .shape { fill-opacity: .28; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  #map .plot.mine .shape { stroke-dasharray: 9 5; }
  #map .plot.sel .shape { fill-opacity: .45; stroke: #fff !important; stroke-width: 3; }
  #map .plot { cursor: pointer; }
  #map .plabel { fill: var(--chalk); font-family: var(--font-body); font-weight: 700; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #0f1114; stroke-linejoin: round; }
  #map .phead { image-rendering: pixelated; pointer-events: none; }
  #map .prev { fill: rgba(255, 255, 255, .18); stroke: #fff; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
  #map polyline.prev { fill: none; }
  .maphint { margin: 10px 0 0; color: var(--chalk-dim); font-size: 14px; min-height: 1.5em; }

  .panel {
    margin-top: 14px; padding: 14px 16px; background: var(--stone);
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b, 0 0 0 2px #0f1114;
  }
  .panel h3 { margin: 0; font: 700 17px/1.25 var(--font-display); overflow-wrap: anywhere; }
  .panel p { margin: 4px 0 0; color: var(--chalk-dim); font-size: 14px; }
  .panel .note { color: var(--chalk); font-size: 16px; }
  .btn {
    font: 700 13px/1 var(--font-display); color: var(--chalk); background: var(--cobble); border: 0; padding: 11px 14px; cursor: pointer;
    box-shadow: inset 2px 2px 0 #6b747c, inset -2px -2px 0 #2a2f34, 0 0 0 2px #0f1114;
  }
  .btn.primary { color: #0e2a19; background: var(--emerald); box-shadow: inset 2px 2px 0 #7fe0a6, inset -2px -2px 0 #1f7a47, 0 0 0 2px #0f1114; }
  .btn.danger { background: var(--redstone); box-shadow: inset 2px 2px 0 #ef7a6c, inset -2px -2px 0 #7d2118, 0 0 0 2px #0f1114; }
  .btn:disabled { opacity: .6; cursor: default; }
  .panel .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

  .form-grid { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 560px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }
  .field label, .field legend { display: block; font-size: 14px; color: var(--chalk-dim); margin-bottom: 4px; padding: 0; }
  fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { position: relative; }
  .swatch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .swatch span { display: block; width: 34px; height: 34px; box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35), 0 0 0 2px #0f1114; }
  .swatch input:checked + span { outline: 3px solid #fff; outline-offset: 2px; }
  .error { color: #ff8f82; font-size: 14px; min-height: 1.4em; margin: 8px 0 0; }

  .plist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .plist button {
    display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--chalk);
    background: var(--stone); border: 0; padding: 8px 12px; cursor: pointer;
    box-shadow: inset 2px 2px 0 #5a636b, inset -2px -2px 0 #15181b;
  }
  .plist button:hover { background: #373e45; }
  .plist .sw { width: 14px; height: 14px; flex: none; }
  .plist .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .sz { margin-left: auto; color: var(--chalk-dim); font-size: 13px; white-space: nowrap; }
  h2.sec { margin: 28px 0 0; font: 700 16px var(--font-display); }

  footer { margin-top: 28px; color: var(--chalk-dim); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .sr { position: absolute; left: -9999px; }

  @media (max-width: 520px) {
    .row { grid-template-columns: 22px 48px minmax(0, 1fr) auto; gap: 0 10px; padding: 10px; }
    .head { width: 48px; height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill[data-state="live"] .dot, .flash { animation: none; }
    .bar i { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="server-name">Minecraft 2026</h1>
      <p class="sub">Wer gerade spielt, und wo gebaut wird.</p>
    </div>
    <div class="live">
      <span class="pill" id="status" data-state="off"><span class="dot"></span><span id="status-text">Verbinde …</span></span>
      <div class="count" aria-label="Spieler online"><span id="online">0</span><small>/<span id="max">0</span></small></div>
    </div>
  </header>

  <div class="views" id="views" role="group" aria-label="Ansicht wählen">
    <button type="button" class="tab" data-view="stats" aria-pressed="true">Statistiken</button>
    <button type="button" class="tab" data-view="map" aria-pressed="false">Bauplätze</button>
  </div>

  <!-- ================= Statistiken ================= -->
  <section id="view-stats">
    <div class="summary">
      <div class="chip" style="--c: var(--gold)"><span>Spielzeit gesamt</span><strong id="sum-total">–</strong></div>
      <div class="chip" style="--c: var(--gold)"><span>Ø Spielzeit</span><strong id="sum-play">–</strong></div>
      <div class="chip" style="--c: var(--gold)"><span>Abgebaut</span><strong id="sum-mined">–</strong></div>
      <div class="chip" style="--c: var(--gold)"><span>Platziert</span><strong id="sum-placed">–</strong></div>
      <div class="chip" style="--c: var(--gold)"><span>Diamanten</span><strong id="sum-dia">–</strong></div>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="Statistik wählen"></div>
    <ol class="list" id="list"></ol>
  </section>

  <!-- ================= Karte ================= -->
  <section id="view-map" hidden>
    <div class="maptools">
      <div class="group" role="group" aria-label="Zoom">
        <button type="button" class="tab" id="zoom-out" aria-label="Herauszoomen">−</button>
        <button type="button" class="tab" id="zoom-in" aria-label="Hineinzoomen">+</button>
        <button type="button" class="tab" id="zoom-fit">Ganze Karte</button>
      </div>
    </div>

    <div class="mapframe"><svg id="map" role="img" aria-label="Karte der Bauplätze"></svg></div>
    <p class="maphint" id="map-hint"></p>

    <form class="panel" id="plot-form" hidden novalidate>
      <h3>Bauplatz speichern</h3>
      <p id="form-summary"></p>
      <div class="form-grid two">
        <div class="field">
          <label for="f-name">Dein Minecraft-Name</label>
          <input id="f-name" name="name" maxlength="16" autocomplete="off" spellcheck="false" list="names" required>
          <datalist id="names"></datalist>
        </div>
        <div class="field">
          <label for="f-note">Was baust du? (optional)</label>
          <input id="f-note" name="note" maxlength="40" autocomplete="off" placeholder="z. B. Dorf am Fluss">
        </div>
      </div>
      <fieldset class="field" style="margin-top:12px">
        <legend>Farbe</legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>
      <p class="error" id="form-error" role="alert"></p>
      <div class="actions">
        <button type="submit" class="btn primary" id="form-save">Speichern</button>
        <button type="button" class="btn" id="form-cancel">Abbrechen</button>
      </div>
    </form>

    <div class="panel" id="plot-info" hidden></div>

    <h2 class="sec" id="plist-title">Alle Bauplätze</h2>
    <ul class="plist" id="plist"></ul>
  </section>

  <footer>
    <span>Aktualisiert: <span id="age">–</span></span>
    <span id="hint"></span>
  </footer>
  <div class="sr" role="status" aria-live="polite" id="live-region"></div>
</div>

<script>
/* ============ EINSTELLUNGEN ============ */
const CONFIG = {
  serverName: "Minecraft 2026",
  // Adresse des Plugins. Leer lassen = automatisch (die Adresse, unter der diese Seite geöffnet wurde, sonst http://localhost:8765).
  apiBase: "",
  // Nur nötig, wenn in der config.yml ein access-key gesetzt ist.
  accessKey: "",
  // Gespeicherter Stand, den das Plugin zu GitHub hochlädt. Wird gezeigt, wenn die Seite den Server nicht live erreicht.
  // github: "NAME/REPOSITORY". Leer = automatisch aus der Adresse NAME.github.io/REPOSITORY.
  github: "",
  dataBranch: "livestats-data",
  cacheFile: "data.json",
  // Wie oft die Seite den gespeicherten Stand neu holt (Sekunden).
  cacheRefresh: 90,
  // Bild der Welt als Hintergrund der Karte. Leer = nur Raster.
  mapImage: "karte.png",
};
/* ======================================= */

const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

$("server-name").textContent = CONFIG.serverName;
document.title = CONFIG.serverName + " – Live-Statistiken";

/* ---------- Speicher im Browser (mit Fallback) ---------- */
const mem = {};
const keep = {
  get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch { /* egal */ } },
};

/* ---------- Hilfsfunktionen ---------- */
const nf = new Intl.NumberFormat("de-DE");
const fmtNum = (n) => nf.format(Math.round(n));
const fmtTime = (min) => {
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${nf.format(h)} h ${m} min` : `${m} min`;
};
const MODES = { SURVIVAL: "Überleben", CREATIVE: "Kreativ", ADVENTURE: "Abenteuer", SPECTATOR: "Zuschauer" };
// Kopf zum Skin: nach Name (stimmt auch, wenn der Server eigene UUIDs vergibt), sonst nach UUID.
const headUrl = (name, size) => `https://mc-heads.net/avatar/${encodeURIComponent(name)}/${size}`;
const skinByName = new Map();   // Spielername (klein) -> Skin-Kennung, vom Plugin geliefert
// Kopf direkt aus dem Skin des Spielers ausschneiden: Gesicht (8,8) und darueber die Hut-Ebene (40,8).
function skinHead(hash, attrs, parent) {
  const outer = svgEl("svg", { viewBox: "0 0 8 8", "aria-hidden": "true", ...attrs }, parent);
  for (const sx of [8, 40]) {
    const part = svgEl("svg", { x: 0, y: 0, width: 8, height: 8, viewBox: `${sx} 8 8 8` }, outer);
    svgEl("image", { href: `https://textures.minecraft.net/texture/${hash}`, width: 64, style: "image-rendering: pixelated" }, part);
  }
  return outer;
}
const svgEl = (name, attrs = {}, parent) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
function setText(node, value, flash) {
  if (node.textContent === value) return;
  const had = node.textContent !== "";
  node.textContent = value;
  if (flash && had) { node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
}

/* =====================================================================
   STATISTIKEN
   ===================================================================== */
const list = $("list");
const rows = new Map();            // uuid -> Zeilen-Objekt
let lastPlayers = [];
let lastUpdate = 0;
let mode = "off";                  // live | demo | off

// id, label: Text auf dem Knopf, get: Wert aus dem Plugin-JSON, unit: Zusatztext unter dem Wert
const STATS = [
  { id: "mined",        label: "Abgebaut",      get: (p) => p.blocksMined ?? 0, fmt: fmtNum, unit: "Blöcke abgebaut" },
  { id: "placed",       label: "Platziert",     get: (p) => p.blocksPlaced ?? 0, fmt: fmtNum, unit: "Blöcke platziert" },
  { id: "diamonds",     label: "Diamanten",     get: (p) => p.diamonds ?? 0, fmt: fmtNum, unit: "Diamanten gesammelt" },
  { id: "deaths",       label: "Tode",          get: (p) => p.deaths,        fmt: fmtNum,   unit: "Tode" },
  { id: "mobKills",     label: "Mob-Kills",     get: (p) => p.mobKills,      fmt: fmtNum,   unit: "Mobs besiegt" },
  { id: "playerKills",  label: "Spieler-Kills", get: (p) => p.playerKills,   fmt: fmtNum,   unit: "Spieler besiegt" },
  { id: "walked",       label: "Strecke",       get: (p) => p.traveledBlocks ?? p.walkedBlocks, fmt: fmtNum, unit: "Blöcke zurückgelegt" },
  { id: "damage",       label: "Schaden",       get: (p) => p.damageDealt,   fmt: fmtNum,   unit: "Schaden verursacht" },
  { id: "level",        label: "Level",         get: (p) => p.level,         fmt: fmtNum,   unit: "Erfahrungslevel" },
];
let current = STATS[0];

function buildTabs() {
  const box = $("tabs");
  box.replaceChildren();
  for (const s of STATS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.textContent = s.label;
    b.setAttribute("aria-pressed", String(s === current));
    b.addEventListener("click", () => {
      current = s;
      history.replaceState(null, "", "#" + s.id);
      syncTabs();
      render();
    });
    box.appendChild(b);
  }
}
function syncTabs() {
  [...$("tabs").children].forEach((c, i) => c.setAttribute("aria-pressed", String(STATS[i] === current)));
}

function createRow(p) {
  const li = document.createElement("li");
  li.className = "row";
  const rank = document.createElement("span"); rank.className = "rank";
  const img = document.createElement("div"); img.className = "head";
  const name = document.createElement("div"); name.className = "name";
  const h3 = document.createElement("h3");
  const sub = document.createElement("p");
  const dot = document.createElement("span"); dot.className = "on";
  const subText = document.createElement("span");
  sub.append(dot, subText);
  name.append(h3, sub);
  const val = document.createElement("div"); val.className = "val";
  const strong = document.createElement("strong");
  const unit = document.createElement("span");
  val.append(strong, unit);
  const bar = document.createElement("div"); bar.className = "bar";
  const fill = document.createElement("i"); bar.appendChild(fill);
  li.append(rank, img, name, val, bar);
  return { el: li, rank, h3, sub, subText, strong, unit, fill, head: img, headKey: null };
}

function setHead(r, p) {
  const key = p.skin || "name:" + p.name;
  if (r.headKey === key) return;
  r.headKey = key;
  r.head.replaceChildren();
  if (p.skin) { skinHead(p.skin, {}, r.head); return; }
  const img = document.createElement("img"); img.alt = "";
  img.src = headUrl(p.name, 64);
  img.onerror = () => { img.onerror = null; img.src = `https://mc-heads.net/avatar/${p.uuid}/64`; };
  r.head.appendChild(img);
}

function updateRow(r, p, rankNo, max) {
  setHead(r, p);
  setText(r.rank, String(rankNo));
  r.el.dataset.rank = rankNo;
  setText(r.h3, p.name);
  const online = p.online !== false;
  r.el.classList.toggle("offline", !online);
  setText(r.subText, online ? `Online · ${MODES[p.gamemode] || p.gamemode} · ${p.world}` : "Offline");
  const v = current.get(p);
  setText(r.strong, current.fmt(v, p), true);
  setText(r.unit, current.unit);
  const pct = max > 0 ? Math.max(2, Math.round((v / max) * 100)) : 0;
  r.fill.style.width = pct + "%";
}

function render() {
  const sorted = lastPlayers.slice().sort((a, b) => {
    const d = current.get(b) - current.get(a);
    return d || a.name.localeCompare(b.name, "de");
  });
  const shown = sorted;
  const max = Math.max(0, ...sorted.map((p) => current.get(p)));

  const present = new Set(lastPlayers.map((p) => p.uuid));
  for (const [uuid, r] of rows) if (!present.has(uuid)) { r.el.remove(); rows.delete(uuid); }
  list.querySelectorAll(".empty").forEach((e) => e.remove());

  if (shown.length === 0) {
    const li = document.createElement("li"); li.className = "empty";
    const s = document.createElement("strong");
    const p = document.createElement("p");
    s.textContent = mode === "off" ? "Keine Verbindung zum Server" : "Noch keine Spieler bekannt";
    p.textContent = mode === "off"
      ? "Die Seite versucht es automatisch weiter. Mit ?demo in der Adresse siehst du Beispieldaten."
      : "Sobald jemand beitritt, erscheint er hier.";
    li.append(s, p); list.appendChild(li);
  }

  const keepSet = new Set(shown.map((p) => p.uuid));
  for (const [uuid, r] of rows) if (!keepSet.has(uuid)) r.el.remove();

  shown.forEach((p, i) => {
    let r = rows.get(p.uuid);
    if (!r) { r = createRow(p); rows.set(p.uuid, r); }
    updateRow(r, p, sorted.indexOf(p) + 1, max);
    if (list.children[i] !== r.el) list.insertBefore(r.el, list.children[i] || null);
  });
}

function setStatus(state, text) {
  const prev = mode;
  mode = state;
  $("status").dataset.state = state;
  setText($("status-text"), text);
  if (prev !== state) $("live-region").textContent = text;
}

function onData(data) {
  lastPlayers = data.players || [];
  let newSkin = false;
  for (const p of lastPlayers) {
    const k = p.name.toLowerCase();
    if (p.skin && skinByName.get(k) !== p.skin) { skinByName.set(k, p.skin); newSkin = true; }
  }
  $("names").replaceChildren(...lastPlayers.map((p) => { const o = document.createElement("option"); o.value = p.name; return o; }));
  if (newSkin && MAP.ready && !$("view-map").hidden) drawPlots();
  if (mode !== "cache") lastUpdate = Date.now();
  $("online").textContent = data.online ?? lastPlayers.filter((p) => p.online !== false).length;
  $("max").textContent = data.max ?? "?";
  const n = lastPlayers.length;
  const sum = (f) => lastPlayers.reduce((a, p) => a + (f(p) || 0), 0);
  setText($("sum-total"), n ? fmtTime(sum((p) => p.playtimeMin)) : "–");
  setText($("sum-play"), n ? fmtTime(Math.round(sum((p) => p.playtimeMin) / n)) : "–");
  setText($("sum-mined"), n ? fmtNum(sum((p) => p.blocksMined)) : "–");
  setText($("sum-placed"), n ? fmtNum(sum((p) => p.blocksPlaced)) : "–");
  setText($("sum-dia"), n ? fmtNum(sum((p) => p.diamonds)) : "–");
  render();
}

/* =====================================================================
   KARTE
   ===================================================================== */
// Mit Kartenbild gilt: 1 Bildpunkt = 1 Einheit, die Bildmitte liegt bei 0/0.
const MAP = { size: 5000, w: 5000, h: 5000, img: false, plots: [], sel: null, vx: 0, vz: 0, vw: 5000, ready: false };
const mapEl = $("map");
const gBg = svgEl("g", {}, mapEl);
const gGrid = svgEl("g", {}, mapEl);
const gPlots = svgEl("g", {}, mapEl);
const gPrev = svgEl("g", {}, mapEl);

const COLORS = ["#3fbf74", "#d9402f", "#e8b63a", "#5b86ea", "#a665e0", "#ee7d2e", "#3cc7d6", "#e868a8"];
const HINT = "Zeichne mit gedrückter Maustaste den Umriss deines Bauplatzes, wie mit einem Stift. Das Mausrad zoomt, mit der rechten Maustaste verschiebst du die Karte. Ein Klick auf einen Bauplatz zeigt Details.";

/* ---------- Eigene Bauplätze (nur in diesem Browser) ---------- */
function ownerToken() {
  let t = keep.get("mc_token");
  if (!t || t.length < 16) {
    const a = new Uint8Array(16);
    crypto.getRandomValues(a);
    t = [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
    keep.set("mc_token", t);
  }
  return t;
}
function mineIds() { try { return JSON.parse(keep.get("mc_mine") || "[]"); } catch { return []; } }
function isMine(id) { return mineIds().includes(id); }
function addMine(id) { keep.set("mc_mine", JSON.stringify([...mineIds(), id])); }
function dropMine(id) { keep.set("mc_mine", JSON.stringify(mineIds().filter((x) => x !== id))); }

/* ---------- Server-Zugriff ---------- */
const blob = (cx, cz, r, n, wob) => Array.from({ length: n }, (_, i) => {
  const a = (i / n) * Math.PI * 2, rr = r * (1 + wob * Math.sin(a * 3 + cx));
  return [Math.round(cx + Math.cos(a) * rr), Math.round(cz + Math.sin(a) * rr)];
});
const demoPlots = [
  { id: 1, name: "Steve_Builder", note: "Dorf am Fluss", color: "#3fbf74", pts: blob(-300, -200, 260, 28, .18) },
  { id: 2, name: "CreeperKing", note: "Burg", color: "#d9402f", pts: blob(750, -650, 200, 24, .1) },
  { id: 3, name: "RedstoneRita", note: "Farmen", color: "#e8b63a", pts: blob(450, 520, 300, 30, .25) },
  { id: 4, name: "AlexMiner", note: "", color: "#5b86ea", pts: blob(-1100, 1000, 170, 20, .12) },
];
let demoNextId = 5;
const demoSnapshot = () => ({ size: 5000, plots: demoPlots.map((p) => ({ ...p })) });

const api = {
  url(path) {
    const base = CONFIG.apiBase || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8765");
    return base.replace(/\/$/, "") + path + (CONFIG.accessKey ? "?key=" + encodeURIComponent(CONFIG.accessKey) : "");
  },
  // Eine Angabe pro Zeile (schluessel=wert), als text/plain, damit der Browser keine Vorabfrage (CORS-Preflight) braucht.
  async post(path, fields) {
    const body = Object.entries(fields).map(([k, v]) => k + "=" + String(v).replace(/[\r\n]+/g, " ")).join("\n");
    let res;
    try {
      res = await fetch(this.url(path), { method: "POST", headers: { "Content-Type": "text/plain" }, body });
    } catch { throw new Error("Keine Verbindung zum Server."); }
    let data = {};
    try { data = await res.json(); } catch { /* leer */ }
    if (!res.ok) throw new Error(data.error || `Das hat nicht geklappt (Fehler ${res.status}).`);
    return data;
  },
  async create(plot) {
    if (DEMO) {
      const id = demoNextId++;
      demoPlots.push({ id, name: plot.name, note: plot.note, color: plot.color, pts: plot.pts });
      onPlots(demoSnapshot());
      return { id };
    }
    const r = await this.post("/api/plots", {
      token: ownerToken(), name: plot.name, note: plot.note, color: plot.color,
      pts: plot.pts.map((p) => p[0] + "," + p[1]).join(";"),
    });
    refreshPlots();
    return r;
  },
  async remove(id) {
    if (DEMO) {
      const i = demoPlots.findIndex((p) => p.id === id);
      if (i >= 0) demoPlots.splice(i, 1);
      onPlots(demoSnapshot());
      return;
    }
    await this.post("/api/plots/delete", { id, token: ownerToken() });
    refreshPlots();
  },
};
async function refreshPlots() {
  try { const res = await fetch(api.url("/api/plots")); if (res.ok) onPlots(await res.json()); } catch { /* der Live-Stream liefert es nach */ }
}

/* ---------- Geometrie ---------- */
function boundsOf(pts) {
  let x1 = Infinity, z1 = Infinity, x2 = -Infinity, z2 = -Infinity;
  for (const [x, z] of pts) { if (x < x1) x1 = x; if (x > x2) x2 = x; if (z < z1) z1 = z; if (z > z2) z2 = z; }
  return { x1, z1, x2, z2 };
}
// Flaechenschwerpunkt; bei sehr schmalen Formen die Mitte des umgebenden Rechtecks.
function centerOf(pts) {
  let a = 0, cx = 0, cz = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x0, z0] = pts[i], [x1, z1] = pts[(i + 1) % pts.length];
    const f = x0 * z1 - x1 * z0;
    a += f; cx += (x0 + x1) * f; cz += (z0 + z1) * f;
  }
  const b = boundsOf(pts);
  if (Math.abs(a) < 1) return { x: (b.x1 + b.x2) / 2, z: (b.z1 + b.z2) / 2 };
  const c = { x: cx / (3 * a), z: cz / (3 * a) };
  return (c.x < b.x1 || c.x > b.x2 || c.z < b.z1 || c.z > b.z2) ? { x: (b.x1 + b.x2) / 2, z: (b.z1 + b.z2) / 2 } : c;
}
const ptsAttr = (pts) => pts.map((p) => p[0] + "," + p[1]).join(" ");

/* ---------- Ansicht (Zoom und Position) ---------- */
function setView(vx, vz, vw) {
  const half = MAP.size / 2;
  vw = Math.min(MAP.size * 1.5, Math.max(120, vw));
  vx = Math.min(half - vw * 0.2, Math.max(-half - vw * 0.8, vx));
  vz = Math.min(half - vw * 0.2, Math.max(-half - vw * 0.8, vz));
  MAP.vx = vx; MAP.vz = vz; MAP.vw = vw;
  mapEl.setAttribute("viewBox", `${vx} ${vz} ${vw} ${vw}`);
  drawGrid();
  drawPlots();
}
function fitView() {
  const vw = MAP.size * 1.06;
  setView(-vw / 2, -vw / 2, vw);
}
function worldAt(clientX, clientY) {
  const r = mapEl.getBoundingClientRect();
  return { x: MAP.vx + ((clientX - r.left) / r.width) * MAP.vw, z: MAP.vz + ((clientY - r.top) / r.height) * MAP.vw };
}
// Zoomt so, dass der Weltpunkt w unter der Bildschirmposition bleibt.
function viewAround(w, clientX, clientY, newVw) {
  const r = mapEl.getBoundingClientRect();
  const fx = (clientX - r.left) / r.width, fz = (clientY - r.top) / r.height;
  newVw = Math.min(MAP.size * 1.5, Math.max(120, newVw));
  setView(w.x - fx * newVw, w.z - fz * newVw, newVw);
}
function zoomAt(clientX, clientY, newVw) { viewAround(worldAt(clientX, clientY), clientX, clientY, newVw); }
function zoomCenter(factor) {
  const r = mapEl.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, MAP.vw * factor);
}
function penPoint(e) {
  const w = worldAt(e.clientX, e.clientY);
  const c = (v, half) => Math.max(-half, Math.min(half, Math.round(v)));
  return [c(w.x, MAP.w / 2), c(w.z, MAP.h / 2)];
}

/* ---------- Zeichnen: Hintergrund, Raster, Bauplätze ---------- */
function drawBg() {
  gBg.replaceChildren();
  const box = { x: -MAP.w / 2, y: -MAP.h / 2, width: MAP.w, height: MAP.h };
  svgEl("rect", { class: "land", ...box }, gBg);
  if (MAP.img) svgEl("image", { href: CONFIG.mapImage, ...box, preserveAspectRatio: "none", style: "image-rendering: pixelated" }, gBg);
}

// Raster nur, solange kein Kartenbild da ist.
function drawGrid() {
  gGrid.replaceChildren();
  if (MAP.img) return;
  const half = MAP.size / 2, vw = MAP.vw;
  const step = vw > 3200 ? 500 : vw > 1600 ? 250 : vw > 700 ? 100 : vw > 300 ? 50 : 10;
  let d = "";
  for (let v = Math.ceil(-half / step) * step; v <= half; v += step) d += `M${v} ${-half}V${half}M${-half} ${v}H${half}`;
  svgEl("path", { class: "gl", d }, gGrid);
}

if (CONFIG.mapImage) {
  const im = new Image();
  im.onload = () => {
    MAP.img = true; MAP.w = im.naturalWidth; MAP.h = im.naturalHeight; MAP.size = Math.max(MAP.w, MAP.h);
    drawBg();
    if (MAP.ready) fitView();
  };
  im.src = CONFIG.mapImage;
}

const area = (p) => (p.b.x2 - p.b.x1) * (p.b.z2 - p.b.z1);

function drawPlots() {
  gPlots.replaceChildren();
  const fs = MAP.vw / 50, hs = fs * 1.8;
  const sorted = MAP.plots.slice().sort((a, b) => area(b) - area(a));
  // Erst alle Flaechen, dann alle Namen: so verdeckt keine Flaeche einen Namen.
  for (const p of sorted) {
    const g = svgEl("g", { "data-id": p.id, class: "plot" + (p.id === MAP.sel ? " sel" : "") + (isMine(p.id) ? " mine" : "") }, gPlots);
    svgEl("polygon", { class: "shape", points: ptsAttr(p.pts), fill: p.color, stroke: p.color }, g);
  }
  for (const p of sorted) {
    const box = { class: "phead", x: p.c.x - hs / 2, y: p.c.z - hs - fs * 0.1, width: hs, height: hs };
    const skin = p.skin || skinByName.get(p.name.toLowerCase());
    if (skin) skinHead(skin, box, gPlots);
    else svgEl("image", { ...box, href: headUrl(p.name, 32), "aria-hidden": "true" }, gPlots);
    const t = svgEl("text", { class: "plabel", x: p.c.x, y: p.c.z + fs * 0.95, "font-size": fs, "stroke-width": fs / 4 }, gPlots);
    t.textContent = p.name;
  }
}

function clearPreview() { gPrev.replaceChildren(); }
function drawPreview(pts) {
  clearPreview();
  svgEl(pts.length > 2 ? "polygon" : "polyline", { class: "prev", points: ptsAttr(pts) }, gPrev);
}

/* ---------- Info, Liste ---------- */
function renderInfo() {
  const box = $("plot-info");
  box.replaceChildren();
  const p = MAP.plots.find((x) => x.id === MAP.sel);
  if (!p) { box.hidden = true; return; }
  box.hidden = false;
  const h = document.createElement("h3"); h.textContent = p.name;
  box.appendChild(h);
  if (p.note) { const n = document.createElement("p"); n.className = "note"; n.textContent = p.note; box.appendChild(n); }
  if (isMine(p.id)) {
    const a = document.createElement("div"); a.className = "actions";
    const del = document.createElement("button"); del.type = "button"; del.className = "btn danger"; del.textContent = "Bauplatz löschen";
    del.addEventListener("click", async () => {
      if (!confirm("Bauplatz von " + p.name + " wirklich löschen?")) return;
      del.disabled = true;
      try { await api.remove(p.id); dropMine(p.id); MAP.sel = null; drawPlots(); renderInfo(); }
      catch (e) { alert(e.message); del.disabled = false; }
    });
    a.appendChild(del); box.appendChild(a);
  }
}

function renderPlotList() {
  const ul = $("plist");
  ul.replaceChildren();
  $("plist-title").textContent = MAP.plots.length === 1 ? "1 Bauplatz" : `${MAP.plots.length} Bauplätze`;
  for (const p of MAP.plots.slice().sort((a, b) => a.name.localeCompare(b.name, "de"))) {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.type = "button";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = p.color;
    const t = document.createElement("span"); t.className = "t"; t.textContent = p.note ? `${p.name} – ${p.note}` : p.name;
    b.append(sw, t);
    b.addEventListener("click", () => {
      select(p.id);
      const vw = Math.max(120, Math.max(p.b.x2 - p.b.x1, p.b.z2 - p.b.z1) * 3);
      setView((p.b.x1 + p.b.x2) / 2 - vw / 2, (p.b.z1 + p.b.z2) / 2 - vw / 2, vw);
      mapEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    li.appendChild(b); ul.appendChild(li);
  }
}

function select(id) {
  MAP.sel = id;
  drawPlots();
  renderInfo();
}

function onPlots(data) {
  const sizeChanged = !MAP.img && data.size !== MAP.size;
  if (!MAP.img) { MAP.size = data.size || MAP.size; MAP.w = MAP.h = MAP.size; }
  MAP.plots = (data.plots || []).filter((p) => Array.isArray(p.pts) && p.pts.length >= 3);
  for (const p of MAP.plots) { p.b = boundsOf(p.pts); p.c = centerOf(p.pts); }
  if (MAP.sel !== null && !MAP.plots.some((p) => p.id === MAP.sel)) MAP.sel = null;
  if (sizeChanged || !MAP.ready) { drawBg(); }
  if (!MAP.ready) { MAP.ready = true; fitView(); } else { drawGrid(); drawPlots(); }
  renderInfo();
  renderPlotList();
}

/* ---------- Stift, Verschieben, Zoom ---------- */
let stroke = null;       // Linie, die gerade gezeichnet wird
let pendingDraw = null;  // fertige Zeichnung, wartet auf "Speichern": { pts }
const pts = new Map();
let pan = null, pinch = null;

const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
// Hoechstens ~400 Punkte speichern.
function thin(list) {
  const k = Math.ceil(list.length / 400);
  return k <= 1 ? list : list.filter((_, i) => i % k === 0);
}

mapEl.addEventListener("contextmenu", (e) => e.preventDefault());
mapEl.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });

mapEl.addEventListener("pointerdown", (e) => {
  mapEl.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {           // zwei Finger: zoomen und verschieben
    if (stroke) { stroke = null; pendingDraw ? drawPreview(pendingDraw.pts) : clearPreview(); }
    const m = mid();
    pan = null; pinch = { d: dist(), vw: MAP.vw, w: worldAt(m.x, m.y) };
  } else if (pts.size === 1 && e.button > 0) {   // rechte oder mittlere Maustaste: verschieben
    pan = { sx: e.clientX, sy: e.clientY, vx: MAP.vx, vz: MAP.vz };
  } else if (pts.size === 1) {
    stroke = { list: [penPoint(e)], sx: e.clientX, sy: e.clientY, moved: false, target: e.target };
  }
});

mapEl.addEventListener("pointermove", (e) => {
  const pt = pts.get(e.pointerId);
  if (!pt) return;
  pt.x = e.clientX; pt.y = e.clientY;
  if (pinch && pts.size === 2) { const m = mid(); viewAround(pinch.w, m.x, m.y, pinch.vw * pinch.d / Math.max(1, dist())); return; }
  if (pan) {
    const r = mapEl.getBoundingClientRect();
    setView(pan.vx - ((e.clientX - pan.sx) * MAP.vw) / r.width, pan.vz - ((e.clientY - pan.sy) * MAP.vw) / r.width, MAP.vw);
  } else if (stroke) {
    if (!stroke.moved && Math.hypot(e.clientX - stroke.sx, e.clientY - stroke.sy) > 5) { stroke.moved = true; closeForm(); }
    if (!stroke.moved) return;
    const p = penPoint(e), last = stroke.list[stroke.list.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) >= Math.max(1, MAP.vw / 250)) {
      stroke.list.push(p);
      drawPreview(stroke.list);
    }
  }
});

function endPointer(e, cancelled) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  pan = null;
  if (!stroke) return;
  const s = stroke; stroke = null;
  if (cancelled) { pendingDraw ? drawPreview(pendingDraw.pts) : clearPreview(); return; }
  if (!s.moved) {                 // nur geklickt: Bauplatz auswaehlen
    const g = s.target && s.target.closest ? s.target.closest("[data-id]") : null;
    select(g ? Number(g.getAttribute("data-id")) : null);
    return;
  }
  const list = thin(s.list), b = boundsOf(list);
  if (list.length >= 3 && b.x2 - b.x1 >= 3 && b.z2 - b.z1 >= 3) openForm(list);
  else { clearPreview(); $("map-hint").textContent = HINT; }
}
mapEl.addEventListener("pointerup", (e) => endPointer(e, false));
mapEl.addEventListener("pointercancel", (e) => endPointer(e, true));
mapEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, MAP.vw * (e.deltaY > 0 ? 1.18 : 1 / 1.18));
}, { passive: false });

$("zoom-in").addEventListener("click", () => zoomCenter(1 / 1.5));
$("zoom-out").addEventListener("click", () => zoomCenter(1.5));
$("zoom-fit").addEventListener("click", fitView);
window.addEventListener("resize", () => { if (MAP.ready && !$("view-map").hidden) drawPlots(); });

/* ---------- Formular ---------- */
const form = $("plot-form");
const swatches = $("swatches");
COLORS.forEach((c, i) => {
  const l = document.createElement("label"); l.className = "swatch";
  const inp = document.createElement("input"); inp.type = "radio"; inp.name = "color"; inp.value = c;
  inp.setAttribute("aria-label", "Farbe " + (i + 1));
  const s = document.createElement("span"); s.style.background = c;
  l.append(inp, s); swatches.appendChild(l);
});

function openForm(list) {
  pendingDraw = { pts: list };
  drawPreview(list);
  $("form-summary").textContent = "Wem gehört diese Fläche?";
  $("f-name").value = keep.get("mc_name") || "";
  $("f-note").value = "";
  const saved = keep.get("mc_color");
  const pick = COLORS.includes(saved) ? saved : COLORS[0];
  swatches.querySelectorAll("input").forEach((i) => { i.checked = i.value === pick; });
  $("form-error").textContent = "";
  form.hidden = false;
  $("map-hint").textContent = "Trage deinen Namen ein und speichere. Zum Neuzeichnen einfach noch einmal auf der Karte zeichnen.";
  form.scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("f-name").focus({ preventScroll: true });
}
function closeForm() {
  if (!pendingDraw && form.hidden) return;
  pendingDraw = null;
  form.hidden = true;
  clearPreview();
}
$("form-cancel").addEventListener("click", () => { closeForm(); $("map-hint").textContent = HINT; });

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!pendingDraw) return;
  const name = $("f-name").value.trim();
  if (!/^[A-Za-z0-9_.]{2,16}$/.test(name)) {
    $("form-error").textContent = "Der Minecraft-Name muss 2 bis 16 Zeichen haben (Buchstaben, Zahlen, _).";
    $("f-name").focus();
    return;
  }
  const colorInput = swatches.querySelector("input:checked");
  const plot = { name, note: $("f-note").value.trim(), color: colorInput ? colorInput.value : COLORS[0], pts: pendingDraw.pts };
  const btn = $("form-save");
  btn.disabled = true;
  $("form-error").textContent = "";
  try {
    const res = await api.create(plot);
    addMine(res.id);
    keep.set("mc_name", name);
    keep.set("mc_color", plot.color);
    closeForm();
    select(res.id);
    $("map-hint").textContent = "Dein Bauplatz ist gespeichert. Alle sehen ihn jetzt auf der Karte.";
  } catch (e) {
    $("form-error").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});

/* =====================================================================
   VERBINDUNG
   ===================================================================== */
let gotLive = false, lastCacheTry = 0;
function startLive() {
  const es = new EventSource(api.url("/api/stream"));
  es.onopen = () => { gotLive = true; setStatus("live", "Live"); };
  es.onmessage = (ev) => {
    try { gotLive = true; onData(JSON.parse(ev.data)); setStatus("live", "Live"); } catch (e) { console.error(e); }
  };
  es.addEventListener("plots", (ev) => {
    try { onPlots(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  });
  es.onerror = () => {   // EventSource verbindet selbst neu
    if (mode === "cache") return;
    setStatus("off", "Getrennt, verbinde neu …");
    render();
    loadCache();
  };
}

// Wo liegt der gespeicherte Stand? Bei GitHub Pages im Daten-Zweig des Repositorys.
function githubRepo() {
  if (CONFIG.github) return CONFIG.github;
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return "";
  const first = location.pathname.split("/").filter(Boolean)[0];
  return m[1] + "/" + (first && !first.includes(".") ? first : m[1] + ".github.io");
}
async function fetchCache() {
  const repo = githubRepo(), file = CONFIG.cacheFile;
  const urls = repo ? [
    // GitHub-API: immer aktuell; unveraenderte Antworten (304) zaehlen nicht gegen das Abruflimit.
    { url: `https://api.github.com/repos/${repo}/contents/${file}?ref=${encodeURIComponent(CONFIG.dataBranch)}`, opt: { cache: "no-cache", headers: { Accept: "application/vnd.github.raw" } } },
    // Ersatz, falls das Limit erreicht ist (kann bis zu 5 Minuten alt sein).
    { url: `https://raw.githubusercontent.com/${repo}/${encodeURIComponent(CONFIG.dataBranch)}/${file}`, opt: { cache: "no-cache" } },
  ] : [];
  urls.push({ url: file + "?t=" + Date.now(), opt: { cache: "no-store" } });
  for (const u of urls) {
    try { const res = await fetch(u.url, u.opt); if (res.ok) return await res.json(); } catch { /* naechste Quelle */ }
  }
  return null;
}

// Server nicht erreichbar: zuletzt gespeicherten Stand anzeigen und regelmaessig neu holen.
let cacheTimer = null;
async function loadCache() {
  if (!CONFIG.cacheFile || Date.now() - lastCacheTry < 30000) return;
  lastCacheTry = Date.now();
  if (!cacheTimer) cacheTimer = setInterval(() => { if (mode !== "live") loadCache(); }, Math.max(60, CONFIG.cacheRefresh) * 1000);
  const data = await fetchCache();
  if (!data || !data.stats || mode === "live") return;
  const t = new Date(data.savedAt || data.stats.time || Date.now());
  const when = t.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const fresh = Date.now() - t.getTime() < 5 * 60000;   // Server laeuft noch und laedt regelmaessig hoch
  const players = (data.stats.players || []).map((p) => ({ ...p, online: fresh && p.online !== false }));
  onData({ ...data.stats, online: fresh ? data.stats.online : 0, players });
  if (data.plots) onPlots(data.plots);
  setStatus("cache", (fresh ? "Stand " : "Server offline · Stand ") + when);
  $("age").textContent = when + " Uhr (aktualisiert sich alle " + Math.max(60, CONFIG.cacheRefresh) + " s)";
  $("map-hint").textContent = "Hier siehst du die Bauplätze. Neue einzeichnen kannst du über den Link direkt vom Server.";
}

function startDemo() {
  setStatus("demo", "Demo-Daten");
  $("hint").textContent = "Das sind Beispieldaten. Ohne ?demo in der Adresse zeigt die Seite den echten Server.";
  const names = ["Steve_Builder", "CreeperKing", "AlexMiner", "RedstoneRita", "Netherfuchs"];
  const uuids = [
    "069a79f4-44e9-4726-a5be-fca90e38aaf5", "853c80ef-3c37-49fd-aa49-938b674adae6",
    "61699b2e-d327-4a01-9f1e-0ea8c3f06bc6", "ec561538-f3fd-461d-aff5-086b22154bce",
    "f7c77d99-9f15-4a66-a87d-c4a51ef30d19",
  ];
  const modes = ["SURVIVAL", "SURVIVAL", "CREATIVE", "SURVIVAL", "ADVENTURE"];
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const ps = names.map((name, i) => ({
    name, uuid: uuids[i], health: rnd(6, 20), maxHealth: 20, food: rnd(8, 20), level: rnd(2, 45),
    gamemode: modes[i], world: i === 4 ? "world_nether" : "world", x: rnd(-800, 800), y: rnd(40, 90), z: rnd(-800, 800),
    ping: rnd(15, 90), playtimeMin: rnd(120, 9000), deaths: rnd(0, 40), mobKills: rnd(20, 900),
    playerKills: rnd(0, 6), jumps: rnd(500, 9000), walkedBlocks: rnd(2000, 90000), damageDealt: rnd(100, 5000),
    blocksMined: rnd(3000, 120000), blocksPlaced: rnd(2000, 90000), diamonds: rnd(0, 180),
  }));
  let t = 0;
  ps[3].online = false; ps[4].online = false;
  const push = () => onData({ online: 3, max: 20, players: ps.map((p) => ({ ...p })) });
  setInterval(() => {
    t++;
    ps.forEach((p) => {
      if (p.online === false) return;
      p.walkedBlocks += rnd(0, 5);
      if (Math.random() < .4) p.blocksMined += rnd(1, 3);
      if (Math.random() < .3) p.blocksPlaced += rnd(1, 2);
      if (Math.random() < .01) p.diamonds++;
      if (Math.random() < .03) p.mobKills++;
      if (Math.random() < .004) p.deaths++;
      if (Math.random() < .002) p.level++;
      if (Math.random() < .1) p.damageDealt += rnd(1, 8);
      if (t % 20 === 0) p.playtimeMin++;
    });
    push();
  }, 1000);
  push();
  onPlots(demoSnapshot());
}

/* =====================================================================
   ANSICHTEN UND START
   ===================================================================== */
function showView(v) {
  $("view-stats").hidden = v !== "stats";
  $("view-map").hidden = v !== "map";
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  if (v === "map") {
    $("map-hint").textContent = $("map-hint").textContent || HINT;
    if (MAP.ready) { drawGrid(); drawPlots(); }
  }
}
function applyHash() {
  const h = location.hash.slice(1);
  if (h === "karte") { showView("map"); return; }
  const s = STATS.find((x) => x.id === h);
  if (s) { current = s; syncTabs(); render(); }
  showView("stats");
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  history.replaceState(null, "", b.dataset.view === "map" ? "#karte" : "#" + current.id);
  showView(b.dataset.view);
}));
window.addEventListener("hashchange", applyHash);

buildTabs();
syncTabs();
setInterval(() => {
  if (!lastUpdate || mode === "cache") return;
  const s = Math.round((Date.now() - lastUpdate) / 1000);
  $("age").textContent = s <= 1 ? "gerade eben" : `vor ${s} s`;
  if (mode === "live" && s > 5) { setStatus("off", "Keine Daten seit " + s + " s"); loadCache(); }
}, 1000);

applyHash();
render();
if (DEMO) startDemo(); else startLive();
</script>
